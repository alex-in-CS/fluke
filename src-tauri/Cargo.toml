[package]
name = "fluke"
version = "0.1.0"
description = "Real-time AI copilot for calls and meetings. Bring your own keys."
authors = ["alex-in-CS"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fluke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.53.3", features = ["full"] }
futures-util = "0.3.34"
eventsource-stream = "0.2.3"
async-trait = "0.1.92"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
cpal = "0.18.2"
rubato = "5.0.1"
hound = "3.5.1"
xcap = "0.9.8"
base64 = "0.23.1"
parking_lot = "0.12.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "json", "multipart", "rustls", "stream", "system-proxy"] }
keyring = "4.2.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tauri-plugin-dialog = "2.8.3"
pdf-extract = "0.12.1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2.7.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
